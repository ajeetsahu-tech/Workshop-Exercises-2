<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Campus Lost &amp; Found{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="site-header"><a class="brand" href="{{ url_for('index') }}">Campus Lost &amp; Found</a>
    <nav aria-label="Main navigation"><a href="{{ url_for('index') }}">Notices</a><a class="button small" href="{{ url_for('create_notice') }}">Post a notice</a></nav>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}<div class="flash {{ category }}" role="status">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Workshop demo · Sample contact details are fictional · Run locally only</footer>
</body>
</html>
